<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18° Compleanno di Matteo!</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* --- CONTROLLO MUSICA IN ALTO A DESTRA --- */
        #music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 55px;
            height: 55px;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            opacity: 0;
            transition: all 0.5s ease;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
        }

        #music-control.visible {
            opacity: 1;
        }

        #music-control i {
            color: #ffffff;
            font-size: 1.6rem;
        }

        #music-control.playing {
            animation: pulse-border 1.5s infinite;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        /* --- SCHERMATA INTRO CON PIOGGIA DI SFERE --- */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #141414 0%, #020202 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 1.2s cubic-bezier(0.77, 0, 0.175, 1), visibility 1.2s;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }

        .suspense-text {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 2.2rem;
            margin-bottom: 40px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1.2s forwards 0.3s;
            letter-spacing: 2px;
            z-index: 5;
        }

        /* Sfere cadenti (Nere e Argentate) */
        .falling-sphere {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
            top: -50px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .silver-button {
            background: linear-gradient(135deg, #ffffff 0%, #a6a6a6 50%, #ffffff 100%);
            color: #000;
            font-weight: 900;
            padding: 22px 55px;
            border: none;
            border-radius: 50px;
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
            cursor: pointer;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s forwards 2.5s, pulse-glow 2s infinite;
            z-index: 5;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 20px rgba(255, 255, 255, 0.4); }
            50% { box-shadow: 0 0 45px rgba(255, 255, 255, 0.7); }
            100% { box-shadow: 0 0 20px rgba(255, 255, 255, 0.4); }
        }

        /* --- CARD PRINCIPALE IN GRANDISSIMO --- */
        #main-card {
            max-width: 460px;
            width: 92%;
            background: linear-gradient(145deg, #0a0a0a 0%, #171717 100%);
            border: 2px solid rgba(255, 255, 255, 0.18);
            border-radius: 28px;
            padding: 50px 35px;
            text-align: center;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.95), 0 0 50px rgba(255, 255, 255, 0.08);
            opacity: 0;
            transform: translateY(50px) scale(0.9);
            transition: all 1.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        #main-card.reveal {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .badge {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 7px;
            color: #b3b3b3;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* --- NUOVO GRUPPO VERTICALE: 18 SOPRA, MATTEO SOTTO --- */
        .hero-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        /* Il 18 sta sopra ed è enorme */
        .number-18-top {
            font-size: 8.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 0%, #777777 45%, #ffffff 50%, #777777 55%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            letter-spacing: -3px;
            filter: drop-shadow(0px 8px 20px rgba(255, 255, 255, 0.25));
            margin-bottom: 5px;
        }

        /* Matteo sta subito sotto */
        .name-under {
            font-size: 4.2rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -1px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8), 0 0 25px rgba(255,255,255,0.2);
            text-transform: uppercase;
            line-height: 1;
        }

        .divider {
            height: 2px;
            width: 140px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
            margin: 20px auto;
        }

        .date {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 30px;
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.35);
        }

        .location-info {
            font-size: 1.15rem;
            color: #e0e0e0;
            margin-bottom: 40px;
            line-height: 1.8;
        }

        .location-name {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            margin-top: 5px;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255,255,255,0.15);
        }

        /* --- PULSANTI AGGRANDITI --- */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .action-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            padding: 18px 24px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: 2px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            text-transform: uppercase;
        }

        /* Bottone Mappa */
        .btn-map {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.85);
            color: #ffffff;
        }

        .btn-map:hover {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        /* Bottone Conferma */
        .btn-confirm {
            background: linear-gradient(135deg, #ffffff 0%, #909090 100%);
            color: #000000;
            border: none;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.3);
        }

        .btn-confirm:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>

    <div id="yt-player" style="position: absolute; top: -9999px; left: -9999px; width: 1px; height: 1px;"></div>

    <div id="music-control" onclick="toggleMusic()">
        <i id="music-icon" class="fas fa-headphones"></i>
    </div>

    <div id="intro-screen">
        <p class="suspense-text">Sei pronto all'evento dell'anno?</p>
        <button class="silver-button" onclick="startReveal()">Apri l'invito</button>
    </div>

    <div id="main-card">
        <div class="badge">Ti aspetto per festeggiare</div>
        
        <div class="hero-group">
            <div class="number-18-top">18</div>
            <div class="name-under">MATTEO</div>
        </div>
        
        <div class="divider"></div>
        
        <div class="date">30 AGOSTO</div>
        
        <div class="location-info">
            Presso<br>
            <div class="location-name">Etna Country</div>
            <span style="font-size: 1rem; color: #a6a6a6; font-weight: 700;">Via Etnea, 396 - Tremestieri Etneo (CT)</span>
        </div>

        <div class="btn-container">
            <a href="https://maps.google.com/?q=Etna+Country+Via+Etnea+396+Tremestieri+Etneo" target="_blank" class="action-btn btn-map">
                <i class="fas fa-map-marker-alt"></i> Mappa Posizione
            </a>
            <a href="https://wa.me/393761162474?text=Confermo%20la%20mia%20presenza!" target="_blank" class="action-btn btn-confirm">
                <i class="fas fa-check"></i> Conferma Presenza
            </a>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let player;
        let isPlaying = false;
        const youtubeId = "JFOLJwOoorQ"; // La tua canzone "Happy Birthday" di Sfera Ebbasta

        // Inizializza il player di YouTube in modo sicuro
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '1',
                width: '1',
                videoId: youtubeId,
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'modestbranding': 1,
                    'rel': 0,
                    'showinfo': 0,
                    'loop': 1,
                    'playlist': youtubeId
                },
                events: {
                    'onReady': () => { console.log("Player pronto!"); }
                }
            });
        }

        // Crea la pioggia di sfere NERE e ARGENTATE
        function createFallingSpheres() {
            const introScreen = document.getElementById('intro-screen');
            
            for (let i = 0; i < 45; i++) {
                setTimeout(() => {
                    const sphere = document.createElement('div');
                    sphere.classList.add('falling-sphere');
                    
                    const size = Math.random() * 25 + 15;
                    sphere.style.width = `${size}px`;
                    sphere.style.height = `${size}px`;
                    sphere.style.left = `${Math.random() * 100}vw`;
                    
                    // 50% Nere con bordo argento lucido, 50% Argento/Bianco brillante
                    if (Math.random() > 0.5) {
                        // SFERA NERA METALLICA
                        sphere.style.backgroundColor = '#151515';
                        sphere.style.border = '2px solid #b0b0b0';
                        sphere.style.boxShadow = '0 0 12px rgba(255, 255, 255, 0.2)';
                    } else {
                        // SFERA ARGENTATA LUMINOSA
                        sphere.style.backgroundColor = '#e0e0e0';
                        sphere.style.boxShadow = '0 0 15px rgba(255, 255, 255, 0.5)';
                    }
                    
                    const duration = Math.random() * 2.5 + 2.5;
                    sphere.style.animationDuration = `${duration}s`;
                    
                    introScreen.appendChild(sphere);
                    
                    setTimeout(() => {
                        sphere.remove();
                    }, duration * 1000);
                }, i * 120);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            createFallingSpheres();
        });

        function startReveal() {
            // Sblocca e avvia la canzone di Sfera Ebbasta direttamente tramite l'azione del click
            if (player && typeof player.playVideo === 'function') {
                player.playVideo();
                isPlaying = true;
            }
            
            // Attiva il tasto cuffie in alto a destra
            const musicControl = document.getElementById('music-control');
            musicControl.classList.add('visible', 'playing');

            // Avvia la dissolvenza
            const intro = document.getElementById('intro-screen');
            intro.style.opacity = '0';
            intro.style.visibility = 'hidden';

            // Mostra la card dell'invito
            setTimeout(() => {
                document.getElementById('main-card').classList.add('reveal');
                document.body.style.overflow = 'auto';
            }, 500);
        }

        function toggleMusic() {
            const musicIcon = document.getElementById('music-icon');
            const musicControl = document.getElementById('music-control');

            if (isPlaying) {
                if (player && typeof player.pauseVideo === 'function') {
                    player.pauseVideo();
                }
                musicIcon.className = "fas fa-volume-mute";
                musicControl.classList.remove('playing');
                isPlaying = false;
            } else {
                if (player && typeof player.playVideo === 'function') {
                    player.playVideo();
                }
                musicIcon.className = "fas fa-headphones";
                musicControl.classList.add('playing');
                isPlaying = true;
            }
        }
    </script>
</body>
</html>
