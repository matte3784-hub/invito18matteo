<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18° Compleanno di Matteo!</title>

    <!-- META TAG PER L'ANTEPRIMA DI CONDIVISIONE (OPEN GRAPH) -->
    <meta property="og:title" content="18° Compleanno di Matteo!" />
    <meta property="og:description" content="Sei stato invitato al 18esimo di Matteo! Clicca per aprire l'invito." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="anteprima.jpg" /> 
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Font Eleganti e Icone -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Playfair+Display:ital,wght@0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* --- CONTROLLO MUSICA IN ALTO A DESTRA --- */
        #music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            opacity: 0;
            transition: all 0.5s ease;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
        }

        #music-control.visible {
            opacity: 1;
        }

        #music-control i {
            color: #ffffff;
            font-size: 1.4rem;
        }

        #music-control.playing {
            animation: pulse-border 1.5s infinite;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        /* --- SCHERMATA INTRO CON PIOGGIA DI SFERE --- */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #141414 0%, #020202 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 1.2s cubic-bezier(0.77, 0, 0.175, 1), visibility 1.2s;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }

        /* SCRITTA INIZIALE AD APPARIZIONE GRADUALE ED ELEGANTE */
        .suspense-container {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 2.4rem;
            line-height: 1.4;
            max-width: 90%;
            margin-bottom: 45px;
            color: #ffffff;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .word {
            opacity: 0;
            transform: translateY(15px);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        /* Animazioni temporizzate per le singole parole */
        .word-1 {
            animation: fadeInUpWord 1s forwards 0.3s;
        }
        .word-2 {
            animation: fadeInUpWord 1s forwards 1.1s;
        }
        .word-3 {
            font-family: 'Montserrat', sans-serif;
            font-style: normal;
            font-weight: 900;
            font-size: 2.8rem;
            text-transform: uppercase;
            letter-spacing: -1px;
            color: #ffffff;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
            animation: fadeInUpWord 1.2s forwards 2.0s;
            margin-top: 5px;
        }

        @keyframes fadeInUpWord {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Sfere cadenti */
        .falling-sphere {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
            top: -50px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }

        .silver-button {
            background: linear-gradient(135deg, #ffffff 0%, #a6a6a6 50%, #ffffff 100%);
            color: #000;
            font-weight: 900;
            padding: 20px 50px;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
            cursor: pointer;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUpWord 1s forwards 3.2s, pulse-glow 2s infinite;
            z-index: 5;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 20px rgba(255, 255, 255, 0.4); }
            50% { box-shadow: 0 0 45px rgba(255, 255, 255, 0.7); }
            100% { box-shadow: 0 0 20px rgba(255, 255, 255, 0.4); }
        }

        /* --- CARD PRINCIPALE COMPATTA (OTTIMIZZATA MOBILE) --- */
        #main-card {
            max-width: 400px;
            width: 92%;
            background: linear-gradient(145deg, #0a0a0a 0%, #151515 100%);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.95), 0 0 50px rgba(255, 255, 255, 0.05);
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        #main-card.reveal {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* "Ti aspetto per festeggiare" */
        .badge {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: #b3b3b3;
            text-transform: uppercase;
            margin-top: 10px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* --- CONTENITORE COMPATTO: Mat | 18 | teo --- */
        .hero-group {
            position: relative;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 5px;
            width: 100%;
        }

        .name-background-container {
            position: absolute;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 1;
            pointer-events: none;
        }

        .name-part {
            font-size: 2.2rem; 
            font-weight: 900;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        /* EFFETTO NEON ILLUMINATO SULLE PIPE */
        .pipe-divider {
            font-size: 2.3rem;
            font-weight: 700;
            color: #ffffff;
            user-select: none;
            text-shadow: 
                0 0 8px #ffffff,
                0 0 15px #ffffff,
                0 0 25px rgba(255, 255, 255, 0.9),
                0 0 35px rgba(255, 255, 255, 0.7);
            animation: neon-flicker 3s infinite alternate;
            z-index: 3;
        }

        @keyframes neon-flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                text-shadow: 
                    0 0 8px #ffffff,
                    0 0 15px #ffffff,
                    0 0 25px rgba(255, 255, 255, 0.9),
                    0 0 35px rgba(255, 255, 255, 0.7);
                opacity: 1;
            }
            20%, 24%, 55% {
                text-shadow: none;
                opacity: 0.75;
            }
        }

        .number-18-foreground {
            position: absolute;
            font-size: 4.2rem;
            font-weight: 950;
            background: linear-gradient(135deg, #ffffff 0%, #888888 45%, #ffffff 50%, #888888 55%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            letter-spacing: -1px;
            z-index: 2;
            filter: drop-shadow(0px 8px 15px rgba(0, 0, 0, 0.95)) drop-shadow(0px 0px 15px rgba(255, 255, 255, 0.2));
            pointer-events: none;
        }

        .divider {
            height: 2px;
            width: 80px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            margin: 10px auto;
        }

        /* --- DATA, ORARIO E PUNTUALITÀ --- */
        .datetime-container {
            margin-bottom: 20px;
        }

        .date {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 3px;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
            margin-bottom: 2px;
        }

        .time {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .punctuality-note {
            font-size: 0.78rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #a6a6a6;
        }

        /* --- LOCATION --- */
        .location-info {
            font-size: 0.95rem;
            color: #e0e0e0;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .location-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.7rem;
            font-weight: 700;
            color: #ffffff;
            margin-top: 4px;
            margin-bottom: 4px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        /* --- NOTA COSTUME ELEGANTE --- */
        .costume-note {
            background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid rgba(255, 255, 255, 0.6);
            padding: 8px 12px;
            border-radius: 4px 8px 8px 4px;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.1rem;
            color: #ffffff;
            margin: 0 auto 20px auto;
            max-width: 90%;
            text-align: center;
            letter-spacing: 1.5px;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.02);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .costume-note i {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.8);
        }

        /* --- PULSANTI COMPATTI --- */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            padding: 13px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            text-transform: uppercase;
        }

        .btn-map {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.85);
            color: #ffffff;
        }

        .btn-map:hover {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.45);
            transform: translateY(-2px);
        }

        .btn-confirm {
            background: linear-gradient(135deg, #ffffff 0%, #909090 100%);
            color: #000000;
            border: none;
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.25);
        }

        .btn-confirm:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <!-- CONTENITORE NASCOSTO PER YOUTUBE PLAYER API -->
    <div id="yt-player" style="position: absolute; top: -9999px; left: -9999px; width: 1px; height: 1px;"></div>

    <!-- CONTROLLO AUDIO IN ALTO A DESTRA -->
    <div id="music-control" onclick="toggleMusic()">
        <i id="music-icon" class="fas fa-headphones"></i>
    </div>

    <!-- 1. SCHERMATA INTRO CON PIOGGIA DI SFERE -->
    <div id="intro-screen">
        <div class="suspense-container">
            <span class="word word-1">Sei...</span>
            <span class="word word-2">pronto...</span>
            <span class="word word-3">all'evento dell'anno?</span>
        </div>
        <button class="silver-button" onclick="startReveal()">Apri l'invito</button>
    </div>

    <!-- 2. CARD PRINCIPALE -->
    <div id="main-card">
        <div class="badge">Ti aspetto per festeggiare</div>
        
        <!-- MAT | 18 | TEO -->
        <div class="hero-group">
            <div class="name-background-container">
                <span class="name-part">MAT</span>
                <span class="pipe-divider">|</span>
                <span class="name-part" style="opacity: 0; width: 65px;">18</span>
                <span class="pipe-divider">|</span>
                <span class="name-part">TEO</span>
            </div>
            <div class="number-18-foreground">18</div>
        </div>
        
        <div class="divider"></div>
        
        <!-- SEZIONE DATA, ORA E RACCOMANDAZIONE -->
        <div class="datetime-container">
            <div class="date">30 AGOSTO</div>
            <div class="time">ore 20:00</div>
            <div class="punctuality-note">Si raccomanda la puntualità</div>
        </div>
        
        <div class="location-info">
            Presso<br>
            <div class="location-name">Etna Country</div>
            <span style="font-size: 0.85rem; color: #a6a6a6; font-weight: 700;">Via Etnea, 396 - Tremestieri Etneo (CT)</span>
        </div>

        <!-- NOTA COSTUME DA BAGNO -->
        <div class="costume-note">
            <i class="fas fa-swimmer"></i>
            <span>P.S. Porta il costume!</span>
        </div>

        <!-- BOTTONI INTERATTIVI -->
        <div class="btn-container">
            <a href="https://maps.google.com/?q=Etna+Country+Via+Etnea+396+Tremestieri+Etneo" target="_blank" class="action-btn btn-map">
                <i class="fas fa-map-marker-alt"></i> Mappa Posizione
            </a>
            <a href="https://wa.me/393761162474?text=Confermo%20la%20mia%20presenza!" target="_blank" class="action-btn btn-confirm">
                <i class="fas fa-check"></i> Conferma Presenza
            </a>
        </div>
    </div>

    <!-- API di YouTube per l'avvio forzato -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let player;
        let isPlaying = false;
        const youtubeId = "JFOLJwOoorQ"; // Sfera Ebbasta - Happy Birthday

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '1',
                width: '1',
                videoId: youtubeId,
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'modestbranding': 1,
                    'rel': 0,
                    'showinfo': 0,
                    'loop': 1,
                    'playlist': youtubeId
                },
                events: {
                    'onReady': () => { console.log("Player pronto!"); }
                }
            });
        }

        // Pioggia di sfere NERE e ARGENTATE
        function createFallingSpheres() {
            const introScreen = document.getElementById('intro-screen');
            
            for (let i = 0; i < 45; i++) {
                setTimeout(() => {
                    const sphere = document.createElement('div');
                    sphere.classList.add('falling-sphere');
                    
                    const size = Math.random() * 20 + 15;
                    sphere.style.width = `${size}px`;
                    sphere.style.height = `${size}px`;
                    sphere.style.left = `${Math.random() * 100}vw`;
                    
                    if (Math.random() > 0.5) {
                        sphere.style.backgroundColor = '#151515';
                        sphere.style.border = '2px solid #b0b0b0';
                        sphere.style.boxShadow = '0 0 12px rgba(255, 255, 255, 0.2)';
                    } else {
                        sphere.style.backgroundColor = '#e0e0e0';
                        sphere.style.boxShadow = '0 0 15px rgba(255, 255, 255, 0.5)';
                    }
                    
                    const duration = Math.random() * 2.5 + 2.5;
                    sphere.style.animationDuration = `${duration}s`;
                    
                    introScreen.appendChild(sphere);
                    
                    setTimeout(() => {
                        sphere.remove();
                    }, duration * 1000);
                }, i * 120);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            createFallingSpheres();
        });

        function startReveal() {
            if (player && typeof player.playVideo === 'function') {
                player.playVideo();
                isPlaying = true;
            }
            
            const musicControl = document.getElementById('music-control');
            musicControl.classList.add('visible', 'playing');

            const intro = document.getElementById('intro-screen');
            intro.style.opacity = '0';
            intro.style.visibility = 'hidden';

            setTimeout(() => {
                document.getElementById('main-card').classList.add('reveal');
                document.body.style.overflow = 'auto';
            }, 500);
        }

        function toggleMusic() {
            const musicIcon = document.getElementById('music-icon');
            const musicControl = document.getElementById('music-control');

            if (isPlaying) {
                if (player && typeof player.pauseVideo === 'function') {
                    player.pauseVideo();
                }
                musicIcon.className = "fas fa-volume-mute";
                musicControl.classList.remove('playing');
                isPlaying = false;
            } else {
                if (player && typeof player.playVideo === 'function') {
                    player.playVideo();
                }
                musicIcon.className = "fas fa-headphones";
                musicControl.classList.add('playing');
                isPlaying = true;
            }
        }
    </script>
</body>
</html>
