<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18° Compleanno di Matteo!</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* --- CONTROLLO MUSICA IN ALTO A DESTRA --- */
        #music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            opacity: 0;
            transition: all 0.5s ease;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        #music-control.visible {
            opacity: 1;
        }

        #music-control i {
            color: #ffffff;
            font-size: 1.4rem;
        }

        #music-control.playing {
            animation: pulse-border 1.5s infinite;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        /* --- SCHERMATA INTRO (SUSPENSE & ANIMAZIONE) --- */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #151515 0%, #020202 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 1.2s cubic-bezier(0.77, 0, 0.175, 1), visibility 1.2s;
            cursor: pointer;
            text-align: center;
            padding: 20px;
        }

        .suspense-text {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: #8a8a8a;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1.5s forwards 0.5s;
            letter-spacing: 2px;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .silver-button {
            background: linear-gradient(135deg, #ffffff 0%, #a6a6a6 50%, #ffffff 100%);
            color: #000;
            font-weight: 900;
            padding: 20px 45px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
            cursor: pointer;
            opacity: 0;
            animation: fadeInUp 1.5s forwards 1.8s, pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 20px rgba(255, 255, 255, 0.3); }
            50% { box-shadow: 0 0 40px rgba(255, 255, 255, 0.6); }
            100% { box-shadow: 0 0 20px rgba(255, 255, 255, 0.3); }
        }

        /* --- CARD PRINCIPALE (DISEGNO ULTRA PREMIUM) --- */
        #main-card {
            max-width: 430px;
            width: 90%;
            background: linear-gradient(145deg, #0e0e0e 0%, #1a1a1a 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 255, 255, 0.05);
            opacity: 0;
            transform: translateY(50px) scale(0.9);
            transition: all 1.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #main-card.reveal {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .badge {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 6px;
            color: #a3a3a3;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 3.8rem;
            font-weight: 900;
            color: #ffffff;
            line-height: 1;
            margin-bottom: 5px;
            letter-spacing: -2px;
            background: linear-gradient(180deg, #ffffff 0%, #999999 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .number-18 {
            font-size: 8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 0%, #555555 45%, #ffffff 50%, #555555 55%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: -20px 0;
            line-height: 1;
            letter-spacing: -4px;
            filter: drop-shadow(0px 8px 15px rgba(255, 255, 255, 0.15));
        }

        .divider {
            height: 1px;
            width: 100px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            margin: 25px auto;
        }

        .date {
            font-size: 1.7rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 25px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .location-info {
            font-size: 0.95rem;
            color: #b3b3b3;
            margin-bottom: 35px;
            line-height: 1.7;
        }

        .location-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            margin-top: 5px;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        /* --- PULSANTI --- */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .action-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 2px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            text-transform: uppercase;
        }

        /* Bottone Mappa */
        .btn-map {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.8);
            color: #ffffff;
        }

        .btn-map:hover {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        /* Bottone Conferma */
        .btn-confirm {
            background: linear-gradient(135deg, #ffffff 0%, #888888 100%);
            color: #000000;
            border: none;
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.25);
        }

        .btn-confirm:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <iframe id="audio-player" width="0" height="0" src="" frameborder="0" allow="autoplay; encrypted-media"></iframe>

    <div id="music-control" onclick="toggleMusic()">
        <i id="music-icon" class="fas fa-headphones"></i>
    </div>

    <div id="intro-screen" onclick="startReveal()">
        <p class="suspense-text">Sei pronto a scoprire l'evento dell'anno?</p>
        <button class="silver-button">Apri l'invito</button>
    </div>

    <div id="main-card">
        <div class="badge">Ti aspetto per festeggiare</div>
        <h1>MATTEO</h1>
        <div class="number-18">18</div>
        <div class="divider"></div>
        
        <div class="date">30 AGOSTO</div>
        
        <div class="location-info">
            Presso<br>
            <div class="location-name">Etna Country</div>
            <span style="font-size: 0.85rem; color: #8c8c8c;">Via Etnea, 396 - Tremestieri Etneo (CT)</span>
        </div>

        <div class="btn-container">
            <a href="https://maps.google.com/?q=Etna+Country+Via+Etnea+396+Tremestieri+Etneo" target="_blank" class="action-btn btn-map">
                <i class="fas fa-map-marker-alt"></i> Mappa Posizione
            </a>
            <a href="https://wa.me/393761162474?text=Confermo%20la%20mia%20presenza!" target="_blank" class="action-btn btn-confirm">
                <i class="fas fa-check"></i> Conferma Presenza
            </a>
        </div>
    </div>

    <script>
        const youtubeId = "NfF5831_M3g"; 
        const player = document.getElementById('audio-player');
        const musicControl = document.getElementById('music-control');
        const musicIcon = document.getElementById('music-icon');
        let isPlaying = false;

        function startReveal() {
            // Sblocca e avvia l'audio tramite l'interazione dell'utente
            player.src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1&enablejsapi=1`;
            isPlaying = true;
            
            // Attiva graficamente il pulsante in alto a destra
            musicControl.classList.add('visible', 'playing');

            // Avvia dissolvenza intro
            const intro = document.getElementById('intro-screen');
            intro.style.opacity = '0';
            intro.style.visibility = 'hidden';

            // Mostra la card con suspense
            setTimeout(() => {
                document.getElementById('main-card').classList.add('reveal');
                document.body.style.overflow = 'auto';
            }, 600);
        }

        function toggleMusic() {
            if (isPlaying) {
                // Ferma la musica azzerando l'indirizzo
                player.src = "";
                musicIcon.className = "fas fa-volume-mute";
                musicControl.classList.remove('playing');
                isPlaying = false;
            } else {
                // Riparte la musica
                player.src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1&enablejsapi=1`;
                musicIcon.className = "fas fa-headphones";
                musicControl.classList.add('playing');
                isPlaying = true;
            }
        }
    </script>
</body>
</html>
