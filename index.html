<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18° Compleanno di Matteo!</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* --- CONTROLLO MUSICA IN ALTO A DESTRA --- */
        #music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 55px;
            height: 55px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            opacity: 0;
            transition: all 0.5s ease;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        #music-control.visible {
            opacity: 1;
        }

        #music-control i {
            color: #ffffff;
            font-size: 1.6rem;
        }

        #music-control.playing {
            animation: pulse-border 1.5s infinite;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        /* --- SCHERMATA INTRO CON PIOGGIA DI SFERE --- */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #151515 0%, #020202 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 1.2s cubic-bezier(0.77, 0, 0.175, 1), visibility 1.2s;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }

        .suspense-text {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 2rem;
            margin-bottom: 40px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1.2s forwards 0.3s;
            letter-spacing: 2px;
            z-index: 5;
        }

        /* Sfere cadenti (Sfera Ebbasta style) */
        .falling-sphere {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
            top: -50px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .silver-button {
            background: linear-gradient(135deg, #ffffff 0%, #a6a6a6 50%, #ffffff 100%);
            color: #000;
            font-weight: 900;
            padding: 22px 55px;
            border: none;
            border-radius: 50px;
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
            cursor: pointer;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s forwards 2.5s, pulse-glow 2s infinite;
            z-index: 5;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 20px rgba(255, 255, 255, 0.4); }
            50% { box-shadow: 0 0 45px rgba(255, 255, 255, 0.7); }
            100% { box-shadow: 0 0 20px rgba(255, 255, 255, 0.4); }
        }

        /* --- CARD PRINCIPALE IN GRANDISSIMO --- */
        #main-card {
            max-width: 460px;
            width: 92%;
            background: linear-gradient(145deg, #0a0a0a 0%, #171717 100%);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 28px;
            padding: 50px 35px;
            text-align: center;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.95), 0 0 50px rgba(255, 255, 255, 0.08);
            opacity: 0;
            transform: translateY(50px) scale(0.9);
            transition: all 1.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        #main-card.reveal {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .badge {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 7px;
            color: #b3b3b3;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        /* --- NUOVO GRUPPO 3D IN SOVRAPPOSIZIONE --- */
        .hero-group {
            position: relative;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        /* Il 18 sta dietro ed è gigantesco */
        .number-18-bg {
            position: absolute;
            font-size: 11.5rem;
            font-weight: 900;
            background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.02) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            letter-spacing: -6px;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.05));
        }

        /* Matteo sta davanti ed è leggibile */
        .name-foreground {
            position: relative;
            font-size: 4rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -1px;
            z-index: 2;
            text-shadow: 0 4px 15px rgba(0,0,0,0.9), 0 0 30px rgba(255,255,255,0.25);
            text-transform: uppercase;
        }

        .divider {
            height: 2px;
            width: 140px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
            margin: 20px auto;
        }

        .date {
            font-size: 2.1rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 30px;
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.35);
        }

        .location-info {
            font-size: 1.1rem;
            color: #e0e0e0;
            margin-bottom: 40px;
            line-height: 1.8;
        }

        .location-name {
            font-family: 'Playfair Display', serif;
            font-size: 2.1rem;
            font-weight: 700;
            color: #ffffff;
            margin-top: 5px;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        /* --- PULSANTI AGGRANDITI --- */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .action-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            padding: 18px 24px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: 2px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            text-transform: uppercase;
        }

        /* Bottone Mappa */
        .btn-map {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.85);
            color: #ffffff;
        }

        .btn-map:hover {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        /* Bottone Conferma */
        .btn-confirm {
            background: linear-gradient(135deg, #ffffff 0%, #909090 100%);
            color: #000000;
            border: none;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.3);
        }

        .btn-confirm:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>

    <iframe id="audio-player" width="0" height="0" src="" frameborder="0" allow="autoplay; encrypted-media"></iframe>

    <div id="music-control" onclick="toggleMusic()">
        <i id="music-icon" class="fas fa-headphones"></i>
    </div>

    <div id="intro-screen">
        <p class="suspense-text">Sei pronto all'evento dell'anno?</p>
        <button class="silver-button" onclick="startReveal()">Apri l'invito</button>
    </div>

    <div id="main-card">
        <div class="badge">Ti aspetto per festeggiare</div>
        
        <div class="hero-group">
            <div class="number-18-bg">18</div>
            <div class="name-foreground">MATTEO</div>
        </div>
        
        <div class="divider"></div>
        
        <div class="date">30 AGOSTO</div>
        
        <div class="location-info">
            Presso<br>
            <div class="location-name">Etna Country</div>
            <span style="font-size: 0.95rem; color: #a6a6a6; font-weight: 700;">Via Etnea, 396 - Tremestieri Etneo (CT)</span>
        </div>

        <div class="btn-container">
            <a href="https://maps.google.com/?q=Etna+Country+Via+Etnea+396+Tremestieri+Etneo" target="_blank" class="action-btn btn-map">
                <i class="fas fa-map-marker-alt"></i> Mappa Posizione
            </a>
            <a href="https://wa.me/393761162474?text=Confermo%20la%20mia%20presenza!" target="_blank" class="action-btn btn-confirm">
                <i class="fas fa-check"></i> Conferma Presenza
            </a>
        </div>
    </div>

    <script>
        const youtubeId = "NfF5831_M3g"; 
        const player = document.getElementById('audio-player');
        const musicControl = document.getElementById('music-control');
        const musicIcon = document.getElementById('music-icon');
        let isPlaying = false;

        // Funzione per creare la pioggia di "Sfere" (Sfera Ebbasta)
        function createFallingSpheres() {
            const introScreen = document.getElementById('intro-screen');
            const colors = ['#ff0033', '#e0e0e0', '#ffffff', '#8a001a', '#b0b0b0']; // Colori: rossi, argenti, bianchi
            
            for (let i = 0; i < 45; i++) {
                setTimeout(() => {
                    const sphere = document.createElement('div');
                    sphere.classList.add('falling-sphere');
                    
                    // Impostazioni casuali per farle cadere con stile
                    const size = Math.random() * 25 + 15; // Dimensioni miste
                    sphere.style.width = `${size}px`;
                    sphere.style.height = `${size}px`;
                    sphere.style.left = `${Math.random() * 100}vw`;
                    sphere.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    sphere.style.boxShadow = `0 0 15px ${sphere.style.backgroundColor}`;
                    
                    // Durata della caduta
                    const duration = Math.random() * 2.5 + 2.5;
                    sphere.style.animationDuration = `${duration}s`;
                    
                    introScreen.appendChild(sphere);
                    
                    // Rimuove la sfera dopo che è caduta
                    setTimeout(() => {
                        sphere.remove();
                    }, duration * 1000);
                }, i * 120); // Vengono generate una dopo l'altra
            }
        }

        // Avvia la pioggia di sfere appena si apre la pagina
        window.addEventListener('DOMContentLoaded', () => {
            createFallingSpheres();
        });

        function startReveal() {
            // Avvio audio super sbloccato dal click
            player.src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1&enablejsapi=1`;
            isPlaying = true;
            
            // Attiva il pulsante delle cuffie in alto a destra
            musicControl.classList.add('visible', 'playing');

            // Avvia dissolvenza dell'intro
            const intro = document.getElementById('intro-screen');
            intro.style.opacity = '0';
            intro.style.visibility = 'hidden';

            // Svela la card
            setTimeout(() => {
                document.getElementById('main-card').classList.add('reveal');
                document.body.style.overflow = 'auto';
            }, 500);
        }

        function toggleMusic() {
            if (isPlaying) {
                player.src = "";
                musicIcon.className = "fas fa-volume-mute";
                musicControl.classList.remove('playing');
                isPlaying = false;
            } else {
                player.src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1&enablejsapi=1`;
                musicIcon.className = "fas fa-headphones";
                musicControl.classList.add('playing');
                isPlaying = true;
            }
        }
    </script>
</body>
</html>
